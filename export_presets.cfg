; Export settings. In Godot: Project > Export shows these as presets.
; "Web" builds a version that runs in a phone or desktop browser.

[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
; Builds outside the project folder so Godot doesn't try to import it.
export_path="../web_build/index.html"

[preset.0.options]

; Threads off: the game then runs on any web host (like GitHub Pages)
; without special server settings.
variant/thread_support=false
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
; 2 = the game fills the whole browser window.
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
