; Export settings. In Godot: Project > Export shows these as presets.
; "Web" builds a version that runs in a phone or desktop browser.

[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
; Builds outside the project folder so Godot doesn't try to import it.
export_path="../web_build/index.html"

[preset.0.options]

; Threads off: the game then runs on any web host (like GitHub Pages)
; without special server settings.
variant/thread_support=false
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
; 2 = the game fills the whole browser window.
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

; "Android" builds an .apk you can install on an Android phone.
; Godot needs the Android SDK and a keystore set in Editor Settings
; (Export > Android). Debug builds are signed with the debug keystore;
; a Play Store release needs your own keystore filled in below.
[preset.1]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../phone_build/drunken-dragon.apk"

[preset.1.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1"
package/unique_name="com.unclepappygaming.drunkendragon"
package/name="The Drunken Dragon"
package/signed=true
package/show_in_android_tv=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
keystore/release=""
keystore/release_user=""
keystore/release_password=""
launcher_icons/main_192x192="res://icon.png"
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""

; "iOS" writes an Xcode project. It has to be built on a Mac with Xcode
; and an Apple developer account: put your Team ID below (Xcode shows
; it under Signing & Capabilities) before exporting.
[preset.2]

name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../phone_build/ios/DrunkenDragon.ipa"

[preset.2.options]

application/app_store_team_id="YOURTEAMID"
application/bundle_identifier="com.unclepappygaming.drunkendragon"
application/short_version="0.1"
application/version="1"
application/export_project_only=true
application/targeted_device_family=2
application/min_ios_version="12.0"
capabilities/access_wifi=false
user_data/accessible_from_files_app=false
icons/icon_1024x1024="res://icon.png"
